name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    # glibc 2.28: loads on DaVinci Resolve's supported Linux (Rocky 8) and newer distros
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          yum install -y expat-devel zip
          pipx install cmake || python3 -m pip install cmake
          echo "/root/.local/bin" >> $GITHUB_PATH
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLW_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j4
      - name: Engine render test
        run: |
          mkdir -p test-out
          for p in "Default" "Andy Lines" "Andy Lines Gray" "Andy Circles" "Andy Geometric"; do
            ./build/lw_render tests/assets/portrait.png "test-out/$(echo $p | tr ' ' '_').png" --preset "$p" --frames 3
          done
      - name: OpenFX host smoke test
        run: |
          cd test-out
          ../build/smoke_host ../build/bundle ../tests/assets/portrait.png host --frames 4
          for i in 1 2 3 4; do ../build/smoke_host ../build/bundle ../tests/assets/portrait.png preset$i --frames 2 --preset $i; done
          ../build/smoke_host ../build/bundle ../tests/assets/portrait.png random --frames 1 --start 3
          cmp host_3.png random_3.png && echo "random access matches sequential render"
      - name: Package
        run: |
          cp docs/INSTALL.txt build/bundle/
          cd build/bundle && zip -r ../../Linework-linux-x86_64.zip Linework.ofx.bundle INSTALL.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Linework-linux-x86_64
          path: Linework-linux-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: test-renders
          path: test-out/*.png

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal arm64 + x86_64)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build -j4
      - name: Check binary and sign (ad hoc)
        run: |
          lipo -info build/bundle/Linework.ofx.bundle/Contents/MacOS/Linework.ofx
          codesign --force --deep --sign - build/bundle/Linework.ofx.bundle
          codesign --verify --verbose build/bundle/Linework.ofx.bundle
      - name: Engine render test
        run: ./build/lw_render tests/assets/portrait.png mac.png --preset "Andy Lines" --frames 2
      - name: Package
        run: |
          cp docs/INSTALL.txt build/bundle/
          cd build/bundle && ditto -c -k --keepParent Linework.ofx.bundle ../../Linework-macOS-universal.zip && zip -u ../../Linework-macOS-universal.zip INSTALL.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Linework-macOS-universal
          path: Linework-macOS-universal.zip

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release -j4
      - name: Engine render test
        run: .\build\Release\lw_render.exe tests\assets\portrait.png win.png --preset "Andy Lines" --frames 2
      - name: Package
        shell: pwsh
        run: |
          Copy-Item docs\INSTALL.txt build\bundle\
          Compress-Archive -Path build\bundle\Linework.ofx.bundle, build\bundle\INSTALL.txt -DestinationPath Linework-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Linework-windows-x64
          path: Linework-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Linework-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: Linework-*.zip
          generate_release_notes: true
