name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    # glibc 2.28: loads on DaVinci Resolve's supported Linux (Rocky 8) and newer distros
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          yum install -y expat-devel zip
          pipx install cmake || python3 -m pip install cmake
          echo "/root/.local/bin" >> $GITHUB_PATH
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAK_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j4
      - name: Engine render test
        run: |
          mkdir -p test-out
          for p in "Default" "Demo - Lines" "Demo - Lines Gray" "Demo - Circles" "Demo - Dither"; do
            ./build/ak_render tests/assets/portrait.png "test-out/$(echo $p | tr ' ' '_').png" --preset "$p" --frames 3
          done
      - name: OpenFX host smoke test
        run: |
          cd test-out
          ../build/smoke_host ../build/bundle ../tests/assets/portrait.png host --frames 4
          for i in 1 2 3 4; do ../build/smoke_host ../build/bundle ../tests/assets/portrait.png preset$i --frames 2 --preset $i; done
          ../build/smoke_host ../build/bundle ../tests/assets/portrait.png random --frames 1 --start 3
          cmp host_3.png random_3.png && echo "random access matches sequential render"
      - name: Preset files (save, load, presets folder)
        run: |
          cd test-out
          export HOME=$PWD/home
          P="$HOME/Documents/AndyKit Presets/CI Look.andykit"
          ../build/smoke_host ../build/bundle ../tests/assets/portrait.png saved --frames 2 density=80 "akPresetFile=$P" --press akPresetSave
          test -f "$P"
          ../build/smoke_host ../build/bundle ../tests/assets/portrait.png empty --frames 1 --press akPresetLoad
          ../build/smoke_host ../build/bundle ../tests/assets/portrait.png loaded --frames 2 "akPresetFile=$HOME/Documents/AndyKit Presets/CI Look.andykit" --press akPresetLoad
          cmp saved_1.png loaded_1.png && echo "preset file round-trip OK"
          ../build/smoke_host ../build/bundle ../tests/assets/portrait.png menu --frames 2 --preset 5
          cmp saved_1.png menu_1.png && echo "presets folder appears in the menu"
      - name: Package
        run: |
          cp docs/INSTALL.txt build/bundle/
          cd build/bundle && zip -r ../../AndyKit-linux-x86_64.zip AndyKit.ofx.bundle INSTALL.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AndyKit-linux-x86_64
          path: AndyKit-linux-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: test-renders
          path: test-out/*.png

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal arm64 + x86_64)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build -j4
      - name: Check binary and sign (ad hoc)
        run: |
          lipo -info build/bundle/AndyKit.ofx.bundle/Contents/MacOS/AndyKit.ofx
          codesign --force --deep --sign - build/bundle/AndyKit.ofx.bundle
          codesign --verify --verbose build/bundle/AndyKit.ofx.bundle
      - name: AppleScript dialogs compile
        run: |
          osacompile -o /tmp/open.scpt -e 'activate' -e 'set f to choose file with prompt "Load AndyKit preset" default location (POSIX file "/Users")' -e 'POSIX path of f'
          osacompile -o /tmp/save.scpt -e 'activate' -e 'set f to choose file name with prompt "Save AndyKit preset" default name "My Look.andykit" default location (POSIX file "/Users")' -e 'POSIX path of f'
      - name: Engine render test
        run: ./build/ak_render tests/assets/portrait.png mac.png --preset "Demo - Lines" --frames 2
      - name: Package
        run: |
          cp docs/INSTALL.txt build/bundle/
          cd build/bundle && ditto -c -k --keepParent AndyKit.ofx.bundle ../../AndyKit-macOS-universal.zip && zip -u ../../AndyKit-macOS-universal.zip INSTALL.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AndyKit-macOS-universal
          path: AndyKit-macOS-universal.zip

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release -j4
      - name: Engine render test
        run: .\build\Release\ak_render.exe tests\assets\portrait.png win.png --preset "Demo - Lines" --frames 2
      - name: Package
        shell: pwsh
        run: |
          Copy-Item docs\INSTALL.txt build\bundle\
          Compress-Archive -Path build\bundle\AndyKit.ofx.bundle, build\bundle\INSTALL.txt -DestinationPath AndyKit-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AndyKit-windows-x64
          path: AndyKit-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AndyKit-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: AndyKit-*.zip
          generate_release_notes: true
